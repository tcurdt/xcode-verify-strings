version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      # - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    binary: xcode-verify-strings

archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: tcurdt
      name: homebrew-tap
    homepage: "https://github.com/tcurdt/xcode-verify-strings"
    description: "Verify Xcode strings files for missing or inconsistent translations"
    license: "Apache-2.0"
    directory: Formula
    install: |
      bin.install "xcode-verify-strings"
    test: |
      system "#{bin}/xcode-verify-strings", "-d", testpath
